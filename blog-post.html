<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article Link | Cheung Man Loc</title>
    <meta name="description" content="Open an older article link or return to Leo Cheung's blog." />
    <meta name="author" content="Cheung Man Loc" />
    <meta name="robots" content="noindex, follow" />
    <link rel="shortcut icon" href="./assets/images/icon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./assets/css/style.css?v=20261028-1" />
    <link rel="stylesheet" href="./assets/css/field-notes.css?v=20261109-1" />
  </head>
  <body class="portfolio-site">
    <main class="not-found-page">
      <article class="not-found-card active" aria-labelledby="legacy-post-title">
        <h1 class="h2 article-title" id="legacy-post-title">Article link</h1>
        <p id="legacy-post-status" role="status">If this link does not open, choose an article from the blog.</p>
        <p id="legacy-post-status-zh" lang="zh-Hant">如果此連結未能開啟，請到網誌選擇文章。</p>
        <div class="not-found-actions">
          <a class="form-btn" href="/#blog">Browse the blog / <span lang="zh-Hant">返回網誌</span></a>
        </div>
      </article>
    </main>
    <script type="application/json" id="legacy-post-routes">
{
  "OSH_2026": "./blog/osh-2026.html",
  "2nd_runner_up": "./blog/2nd-runner-up.html",
  "ypec-2025": "./blog/ypec-2025.html",
  "cablecon-2025": "./blog/cablecon-2025.html"
}
    </script>
    <script id="legacy-post-redirect">
      (() => {
        try {
          const routes = JSON.parse(document.getElementById("legacy-post-routes").textContent);
          const requested = new URLSearchParams(window.location.search).get("post");
          const target = routes[requested];
          if (requested && typeof target === "string" && /^\.\/blog\/[a-z0-9-]+\.html$/.test(target)) {
            window.location.replace(target + window.location.hash);
            return;
          }
        } catch {
          // The recovery link stays usable if the generated map cannot be read.
        }
        document.getElementById("legacy-post-title").textContent = "Article not found";
        document.getElementById("legacy-post-status").textContent = "This link does not match an article. Choose a post from the blog.";
        document.getElementById("legacy-post-status-zh").textContent = "找不到此連結對應的文章，請到網誌選擇文章。";
      })();
    </script>
  </body>
</html>
